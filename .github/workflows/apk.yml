{ "name": "Construir APK", "on": { "push": { "branches": [ "main" ] }, "workflow_dispatch": {} }, "jobs": { "apk": { "runs-on": "ubuntu-latest", "steps": [ { "name": "Descargar el proyecto", "uses": "actions/checkout@v5" }, { "name": "Ordenar archivos en sus carpetas", "run": "mkdir -p www assets scripts keystore; if [ -f index.html ]; then mv index.html www/; fi; for f in icon-background.png icon-foreground.png icon-only.png splash.png splash-dark.png; do if [ -f $f ]; then mv $f assets/; fi; done; if [ -f patch-android.mjs ]; then mv patch-android.mjs scripts/; fi; if [ -f debug.keystore ]; then mv debug.keystore keystore/; fi; ls -la www assets scripts keystore" }, { "name": "Preparar Node.js", "uses": "actions/setup-node@v5", "with": { "node-version": 22 } }, { "name": "Preparar Java 21", "uses": "actions/setup-java@v5", "with": { "distribution": "temurin", "java-version": 21 } }, { "name": "Licencias de Android (el SDK ya viene instalado)", "run": "echo \"ANDROID_HOME=$ANDROID_HOME\"; yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses > /dev/null || true" }, { "name": "Instalar Capacitor", "run": "npm install --no-audit --no-fund" }, { "name": "Crear el proyecto Android", "run": "npx cap add android" }, { "name": "Permisos de camara", "run": "node scripts/patch-android.mjs" }, { "name": "Icono y pantalla de inicio", "run": "npx capacitor-assets generate --android --assetPath assets || echo 'Iconos por defecto'" }, { "name": "Copiar la app al proyecto Android", "run": "npx cap sync android" }, { "name": "Firma fija", "run": "mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore" }, { "name": "Compilar APK", "working-directory": "android", "run": "chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace" }, { "name": "Publicar el APK", "uses": "actions/upload-artifact@v4", "with": { "name": "Particulas-C175-APK", "path": "android/app/build/outputs/apk/debug/app-debug.apk", "if-no-files-found": "error" } } ] } } }
